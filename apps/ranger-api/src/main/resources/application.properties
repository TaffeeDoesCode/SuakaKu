spring.application.name=api

# Database Configuration (Docker environment variables will override these)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ranger_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ranger_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ranger_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
