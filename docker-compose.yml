version: '3.8'

services:
  # Database Service
  postgres:
    image: postgres:16-alpine
    container_name: ranger-postgres
    restart: always
    environment:
      POSTGRES_DB: ranger_db
      POSTGRES_USER: ranger_user
      POSTGRES_PASSWORD: ranger_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ranger_user -d ranger_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ranger-network

  # Backend Service (Spring Boot)
  ranger-api:
    build:
      context: ./apps/ranger-api   # Update path if your folder is located elsewhere
      dockerfile: Dockerfile
    container_name: ranger-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ranger_db
      SPRING_DATASOURCE_USERNAME: ranger_user
      SPRING_DATASOURCE_PASSWORD: ranger_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ranger-network

volumes:
  postgres_data:

networks:
  ranger-network:
    driver: bridge